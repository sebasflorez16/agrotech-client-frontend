<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F5F5F7">
    <title>Detalle del plan - AgroTech Digital</title>
    <meta name="robots" content="noindex, follow">
    <link rel="shortcut icon" href="../../images/agrotech-negro.png">
    <link rel="stylesheet" href="../../css/liquid-glass-system.css">
    <script src="../../js/config.js"></script>
    <script src="../../js/analytics.js"></script>
    <script src="../../js/meta-tracking.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <style>
        body {
            margin: 0; min-height: 100vh;
            background: linear-gradient(135deg, #F5F5F7 0%, #E8E8ED 100%);
            background-attachment: fixed;
            display: flex; align-items: center; justify-content: center;
            padding: 24px; box-sizing: border-box;
            font-family: 'Inter', 'Poppins', 'Segoe UI', sans-serif;
        }
        .detail-container {
            background: rgba(255,255,255,0.8); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.55); border-radius: 24px;
            padding: 40px; width: 100%; max-width: 640px;
            box-shadow: 0 12px 40px rgba(31,38,135,0.12);
        }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: #4a5568; text-decoration: none; font-size: 14px; margin-bottom: 20px; }
        .back-link:hover { color: #2FB344; }
        .plan-header { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
        .plan-badge { background: linear-gradient(135deg, #2FB344, #1a7a2e); color: #fff; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 980px; }
        .plan-name { font-size: 2rem; font-weight: 800; color: #1D1D1F; margin: 0; }
        .plan-tagline { color: #666; font-size: 15px; margin: 6px 0 20px; }
        .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 24px; }
        .price-amount { font-size: 2.6rem; font-weight: 800; background: linear-gradient(135deg, #2FB344, #1a7a2e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .price-period { color: #888; font-size: 16px; }
        .price-note { color: #999; font-size: 13px; }
        .section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #9aa0a6; margin: 24px 0 10px; }
        .features-list { list-style: none; padding: 0; margin: 0; }
        .features-list li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 15px; color: #2C3E50; }
        .features-list li:last-child { border-bottom: none; }
        .features-list .icon { color: #2FB344; font-size: 18px; flex-shrink: 0; margin-top: 1px; }
        .features-list .cross { color: #c0392b; font-size: 18px; flex-shrink: 0; margin-top: 1px; }
        .limits-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .limit-box { background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.06); border-radius: 14px; padding: 14px; text-align: center; }
        .limit-value { font-size: 1.5rem; font-weight: 800; color: #1D1D1F; }
        .limit-label { font-size: 12px; color: #888; margin-top: 2px; }
        .btn-pay {
            display: block; width: 100%; margin-top: 28px; padding: 16px;
            background: linear-gradient(135deg, #2FB344, #1a7a2e); color: #fff; border: none; border-radius: 980px;
            font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center;
            box-shadow: 0 8px 24px rgba(47,179,68,0.3); transition: all 0.3s ease; box-sizing: border-box;
        }
        .btn-pay:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(47,179,68,0.4); }
        .btn-pay.secondary { background: rgba(47,179,68,0.1); color: #1a7a2e; border: 1px solid rgba(47,179,68,0.25); box-shadow: none; }
        .btn-pay.secondary:hover { background: rgba(47,179,68,0.18); }
        @media (max-width: 768px) {
            .detail-container { padding: 24px; }
            .plan-name { font-size: 1.6rem; }
            .price-amount { font-size: 2.1rem; }
        }
    </style>
</head>
<body>
    <div class="detail-container" id="detailContainer">
        <a href="/" class="back-link"><i class="ti ti-arrow-left"></i> Volver al inicio</a>
        <div id="planContent">Cargando plan…</div>
    </div>

    <script>
    (() => {
        const API = (window.AGROTECH_CONFIG && window.AGROTECH_CONFIG.API_BASE) || '';
        const FEATURE_LABELS = {
            ndvi: 'Análisis NDVI (vigor del cultivo)',
            ndmi: 'NDMI (estrés hídrico)',
            savi: 'SAVI (suelo y vegetación)',
            evi: 'EVI (vigor mejorado)',
            weather_basic: 'Pronóstico climático básico',
            weather_full: 'Pronóstico climático completo',
            historical: 'Histórico de evolución del cultivo',
            continuous_monitoring: 'Monitoreo continuo + alertas automáticas',
            pdf_reports: 'Reportes PDF de tus parcelas',
            advanced_analytics: 'Analítica avanzada',
            api_access: 'Acceso API',
            support_priority: 'Soporte prioritario',
            dedicated_account: 'Cuenta dedicada',
        };
        const META = {
            free: { badge: 'GRATIS', tagline: 'Para empezar a ver tu finca desde el espacio, sin costo.', cta: 'Empezar gratis', note: 'Gratis para siempre · Sin tarjeta' },
            basic: { badge: 'POPULAR', tagline: 'Para productores que quieren datos reales y accionables.', cta: 'Comenzar ahora', note: 'Cancela cuando quieras' },
            pro: { badge: 'PRECISIÓN', tagline: 'Para operaciones que necesitan precisión y prescripción.', cta: 'Comenzar ahora', note: 'Cancela cuando quieras' },
            enterprise: { badge: 'CORPORATIVO', tagline: 'Para operaciones de gran escala con acompañamiento dedicado.', cta: 'Hablar con ventas', note: 'Precio personalizado' },
        };
        const FALLBACK = {
            free: { tier: 'free', name: 'Explorador', price_cop: '0', limits: { parcels: 1, hectares: 30, users: 1, eosda_requests: 5 }, features_included: ['ndvi'] },
            basic: { tier: 'basic', name: 'Agricultor', price_cop: '79000', limits: { parcels: 10, hectares: 100, users: 2, eosda_requests: 100 }, features_included: ['ndvi', 'ndmi', 'savi', 'weather_basic', 'historical'] },
            pro: { tier: 'pro', name: 'Empresarial', price_cop: '179000', limits: { parcels: 50, hectares: 300, users: 3, eosda_requests: 500 }, features_included: ['ndvi', 'ndmi', 'savi', 'evi', 'weather_full', 'historical', 'continuous_monitoring', 'pdf_reports', 'advanced_analytics', 'api_access'] },
            enterprise: { tier: 'enterprise', name: 'Corporativo', price_cop: '600000', limits: { parcels: 9999, hectares: 99999, users: 10, eosda_requests: 99999 }, features_included: ['ndvi', 'ndmi', 'savi', 'evi', 'weather_full', 'historical', 'continuous_monitoring', 'pdf_reports', 'advanced_analytics', 'api_access', 'support_priority', 'dedicated_account'] },
        };

        const fmtCOP = (n) => '$' + new Intl.NumberFormat('es-CO').format(Number(n) || 0);
        const params = new URLSearchParams(window.location.search);
        let tier = params.get('plan') || 'basic';
        if (!FALLBACK[tier]) tier = 'basic';

        function render(plan) {
            const meta = META[plan.tier] || META.basic;
            if (window.AgroTrack) {
                window.AgroTrack.event('ViewContent', {
                    content_name: 'plan_' + plan.tier,
                    content_ids: [plan.tier],
                    value: Number(plan.price_cop) || 0,
                    currency: 'COP'
                });
            }
            const limits = plan.limits || {};
            const features = (plan.features_included || []).map(code => FEATURE_LABELS[code]).filter(Boolean);
            const isFree = plan.tier === 'free';
            const container = document.getElementById('planContent');
            const includes = features.map(f =>
                '<li><i class="ti ti-check icon"></i><span>' + f + '</span></li>'
            ).join('');
            const limitBoxes = [
                { v: limits.parcels >= 9999 ? '∞' : limits.parcels, l: 'parcelas' },
                { v: limits.hectares >= 99999 ? '∞' : limits.hectares + ' ha', l: 'hectáreas' },
                { v: limits.users >= 9999 ? '∞' : limits.users, l: 'usuarios' },
                { v: limits.eosda_requests >= 9999 ? '∞' : limits.eosda_requests, l: 'análisis/mes' },
            ].map(l =>
                '<div class="limit-box"><div class="limit-value">' + l.v + '</div><div class="limit-label">' + l.l + '</div></div>'
            ).join('');
            const ctaHref = isFree ? '/register' : ('checkout.html?plan=' + plan.tier + '&cycle=monthly');
            container.innerHTML =
                '<div class="plan-header"><span class="plan-badge">' + meta.badge + '</span><h1 class="plan-name">' + plan.name + '</h1></div>' +
                '<p class="plan-tagline">' + meta.tagline + '</p>' +
                '<div class="price-row"><span class="price-amount">' + (isFree ? 'Gratis' : fmtCOP(plan.price_cop)) + '</span><span class="price-period">' + (isFree ? '' : '/mes') + '</span><span class="price-note"> · ' + meta.note + '</span></div>' +
                '<div class="section-label">Qué incluye</div>' +
                '<ul class="features-list">' + includes + '</ul>' +
                '<div class="section-label">Límites del plan</div>' +
                '<div class="limits-grid">' + limitBoxes + '</div>' +
                '<a href="' + ctaHref + '" class="btn-pay">' + meta.cta + '</a>';
        }

        render(FALLBACK[tier]);
        fetch(API + '/billing/api/plans/')
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(list => {
                const apiPlan = (list || []).find(p => p.tier === tier);
                if (apiPlan) render(apiPlan);
            })
            .catch(() => { /* se queda el fallback corregido */ });
    })();
    </script>
</body>
</html>
