<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F5F5F7">
    <title>Detalle del plan - AgroTech Digital</title>
    <link rel="shortcut icon" href="../../images/agrotech-negro.png">
    <link rel="stylesheet" href="../../css/liquid-glass-system.css">
    <script src="../../js/config.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <style>
        body {
            margin: 0; min-height: 100vh;
            background: linear-gradient(135deg, #F5F5F7 0%, #E8E8ED 100%);
            background-attachment: fixed;
            display: flex; align-items: center; justify-content: center;
            padding: 24px; box-sizing: border-box;
            font-family: 'Inter', 'Poppins', 'Segoe UI', sans-serif;
        }
        .detail-container {
            background: rgba(255,255,255,0.8); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.55); border-radius: 24px;
            padding: 40px; width: 100%; max-width: 640px;
            box-shadow: 0 12px 40px rgba(31,38,135,0.12);
        }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: #4a5568; text-decoration: none; font-size: 14px; margin-bottom: 20px; }
        .back-link:hover { color: #2FB344; }
        .plan-header { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
        .plan-badge { background: linear-gradient(135deg, #2FB344, #1a7a2e); color: #fff; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 980px; }
        .plan-name { font-size: 2rem; font-weight: 800; color: #1D1D1F; margin: 0; }
        .plan-tagline { color: #666; font-size: 15px; margin: 6px 0 20px; }
        .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 24px; }
        .price-amount { font-size: 2.6rem; font-weight: 800; background: linear-gradient(135deg, #2FB344, #1a7a2e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .price-period { color: #888; font-size: 16px; }
        .price-note { color: #999; font-size: 13px; }
        .section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #9aa0a6; margin: 24px 0 10px; }
        .features-list { list-style: none; padding: 0; margin: 0; }
        .features-list li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 15px; color: #2C3E50; }
        .features-list li:last-child { border-bottom: none; }
        .features-list .icon { color: #2FB344; font-size: 18px; flex-shrink: 0; margin-top: 1px; }
        .features-list .cross { color: #c0392b; font-size: 18px; flex-shrink: 0; margin-top: 1px; }
        .limits-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .limit-box { background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.06); border-radius: 14px; padding: 14px; text-align: center; }
        .limit-value { font-size: 1.5rem; font-weight: 800; color: #1D1D1F; }
        .limit-label { font-size: 12px; color: #888; margin-top: 2px; }
        .btn-pay {
            display: block; width: 100%; margin-top: 28px; padding: 16px;
            background: linear-gradient(135deg, #2FB344, #1a7a2e); color: #fff; border: none; border-radius: 980px;
            font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center;
            box-shadow: 0 8px 24px rgba(47,179,68,0.3); transition: all 0.3s ease; box-sizing: border-box;
        }
        .btn-pay:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(47,179,68,0.4); }
        .btn-pay.secondary { background: rgba(47,179,68,0.1); color: #1a7a2e; border: 1px solid rgba(47,179,68,0.25); box-shadow: none; }
        .btn-pay.secondary:hover { background: rgba(47,179,68,0.18); }
        @media (max-width: 768px) {
            .detail-container { padding: 24px; }
            .plan-name { font-size: 1.6rem; }
            .price-amount { font-size: 2.1rem; }
        }
    </style>
</head>
<body>
    <div class="detail-container" id="detailContainer">
        <a href="/" class="back-link"><i class="ti ti-arrow-left"></i> Volver al inicio</a>
        <div id="planContent">Cargando plan…</div>
    </div>

    <script>
    (() => {
        const PLANS = {
            free: {
                tier: 'free', name: 'Explorador', badge: 'GRATIS',
                tagline: 'Para empezar a ver tu finca desde el espacio, sin costo.',
                price: 'Gratis', period: '', note: 'Sin tarjeta de crédito · 14 días de prueba completa',
                includes: [
                    'Análisis NDVI (vigor del cultivo)',
                    'Histórico de evolución del cultivo',
                    'Mapa satelital de tu parcela',
                ],
                limits: [
                    { v: '5', l: 'parcelas' },
                    { v: '50 ha', l: 'hectáreas' },
                    { v: '1', l: 'usuario' },
                    { v: '20', l: 'análisis/mes' },
                ],
                cta: 'Empezar gratis', secondary: false,
            },
            basic: {
                tier: 'basic', name: 'Agricultor', badge: 'POPULAR',
                tagline: 'Para productores que quieren datos reales y accionables.',
                price: '$79.000', period: '/mes', note: 'Cancela cuando quieras',
                includes: [
                    'Índices NDVI + NDMI + SAVI (vigor, humedad y suelo)',
                    'Histórico de evolución del cultivo',
                    'Pronóstico climático básico',
                    'Escenas satelitales disponibles por fecha',
                    'Mapa satelital de tus parcelas',
                ],
                limits: [
                    { v: '10', l: 'parcelas' },
                    { v: '300 ha', l: 'hectáreas' },
                    { v: '2', l: 'usuarios' },
                    { v: '100', l: 'análisis/mes' },
                ],
                cta: 'Comenzar ahora', secondary: false,
            },
            pro: {
                tier: 'pro', name: 'Empresarial', badge: 'PRECISIÓN',
                tagline: 'Para operaciones que necesitan precisión y prescripción.',
                price: '$179.000', period: '/mes', note: 'Cancela cuando quieras',
                includes: [
                    'Todos los índices: NDVI + NDMI + SAVI + EVI',
                    'Sectorización de manejo (zonas de vigor con K-means)',
                    'Mapa de prescripción (GeoJSON/KML para tu maquinaria)',
                    'Monitoreo continuo + alertas automáticas',
                    'Pronóstico climático completo',
                    'Reportes PDF de tus parcelas',
                ],
                limits: [
                    { v: '50', l: 'parcelas' },
                    { v: '1.000 ha', l: 'hectáreas' },
                    { v: '3', l: 'usuarios' },
                    { v: '500', l: 'análisis/mes' },
                ],
                cta: 'Comenzar ahora', secondary: false,
            },
            enterprise: {
                tier: 'enterprise', name: 'Corporativo', badge: 'EMPRESA',
                tagline: 'Para agroindustrias y operaciones a gran escala.',
                price: '$600.000', period: '/mes', note: 'Soporte dedicado',
                includes: [
                    'Todo lo incluido en Empresarial',
                    'Acceso a API para tu equipo',
                    'Soporte prioritario y cuenta dedicada',
                ],
                limits: [
                    { v: '∞', l: 'parcelas' },
                    { v: '∞', l: 'hectáreas' },
                    { v: '10', l: 'usuarios' },
                    { v: '∞', l: 'análisis/mes' },
                ],
                cta: 'Hablar con ventas', secondary: true,
            },
        };

        const params = new URLSearchParams(window.location.search);
        let tier = params.get('plan') || 'basic';
        if (!PLANS[tier]) tier = 'basic';
        const p = PLANS[tier];

        const container = document.getElementById('planContent');
        const includes = p.includes.map(f =>
            '<li><i class="ti ti-check icon"></i><span>' + f + '</span></li>'
        ).join('');
        const limits = p.limits.map(l =>
            '<div class="limit-box"><div class="limit-value">' + l.v + '</div><div class="limit-label">' + l.l + '</div></div>'
        ).join('');

        const ctaHref = p.tier === 'enterprise'
            ? 'mailto:contacto@agrotechcolombia.com'
            : 'checkout.html?plan=' + p.tier + '&cycle=monthly';

        container.innerHTML =
            '<div class="plan-header"><span class="plan-badge">' + p.badge + '</span><h1 class="plan-name">' + p.name + '</h1></div>' +
            '<p class="plan-tagline">' + p.tagline + '</p>' +
            '<div class="price-row"><span class="price-amount">' + p.price + '</span><span class="price-period">' + p.period + '</span><span class="price-note"> · ' + p.note + '</span></div>' +
            '<div class="section-label">Qué incluye</div>' +
            '<ul class="features-list">' + includes + '</ul>' +
            '<div class="section-label">Límites del plan</div>' +
            '<div class="limits-grid">' + limits + '</div>' +
            '<a href="' + ctaHref + '" class="btn-pay' + (p.secondary ? ' secondary' : '') + '">' + p.cta + '</a>';
    })();
    </script>
</body>
</html>
