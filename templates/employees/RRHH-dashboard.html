<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F5F5F7">
    <title>Empleados | AgroTech Digital</title>
    <link rel="shortcut icon" href="../../images/agrotech solo negro.png">
    <script src="../../js/config.js"></script>
    <script src="../../js/auth-global.js"></script>
    <script src="../../js/sidebar-controller.js"></script>
    <link rel="stylesheet" href="../../css/liquid-glass-system.css">
    <link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="/static/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <style>
        :root { --bg-gradient: linear-gradient(135deg, #F5F5F7 0%, #E8E8ED 100%); }
        body { background: var(--bg-gradient); background-attachment: fixed; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        .page-wrap { max-width: 1300px; margin: 0 auto; padding: 100px 28px 60px; }
        .page-hdr { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 28px; }
        .page-hdr h1 { font-size: clamp(24px,4vw,36px); font-weight: 800; letter-spacing: -0.03em; background: linear-gradient(135deg,#1D1D1F 0%,#2FB344 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; display: flex; align-items: center; gap: 12px; }
        .page-hdr h1 i { font-size: 28px; color: #2FB344; background: rgba(47,179,68,0.1); padding: 10px; border-radius: 14px; -webkit-text-fill-color: #2FB344; }
        .btn-g { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 9999px; border: 1px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; color: #1D1D1F; text-decoration: none; }
        .btn-g:hover { background: rgba(255,255,255,0.95); box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-1px); }
        .btn-g.primary { background: rgba(47,179,68,0.1); border-color: rgba(47,179,68,0.2); color: #1E7A2E; }
        .btn-g.primary:hover { background: #2FB344; color: #fff; border-color: #2FB344; }
        .btn-g.sm { padding: 6px 14px; font-size: 12px; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 28px; }
        .stat { background: rgba(255,255,255,0.7); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.5); border-radius: 18px; padding: 22px 18px; transition: all 0.3s; }
        .stat:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(31,38,135,0.08); }
        .stat .s-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 10px; }
        .stat .s-label { font-size: 12px; font-weight: 600; color: #86868B; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat .s-val { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: #1D1D1F; }
        .s-blue { background: rgba(59,130,246,0.1); color: #3b82f6; }
        .s-purple { background: rgba(139,92,246,0.1); color: #8b5cf6; }
        .s-cyan { background: rgba(6,182,212,0.1); color: #06b6d4; }
        .s-orange { background: rgba(245,158,11,0.1); color: #f59e0b; }
        .s-green { background: rgba(34,197,94,0.1); color: #22c55e; }

        .tabs { display: flex; gap: 4px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px; }
        .tab { padding: 10px 20px; border-radius: 9999px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.25s; border: none; background: rgba(255,255,255,0.4); color: #86868B; font-family: inherit; }
        .tab:hover { background: rgba(255,255,255,0.7); color: #1D1D1F; }
        .tab.active { background: #1D1D1F; color: #fff; }

        .panel { background: rgba(255,255,255,0.7); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.5); border-radius: 22px; padding: 24px; box-shadow: 0 8px 32px rgba(31,38,135,0.06); }
        .panel-hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
        .panel-title { font-size: 17px; font-weight: 700; color: #1D1D1F; }

        .gt-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .gt { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        .gt th { background: rgba(47,179,68,0.05); color: #1E7A2E; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 14px; text-align: left; border-bottom: 2px solid rgba(47,179,68,0.12); white-space: nowrap; }
        .gt th:first-child { border-radius: 10px 0 0 0; }
        .gt th:last-child { border-radius: 0 10px 0 0; }
        .gt td { padding: 12px 14px; border-bottom: 1px solid rgba(0,0,0,0.03); color: #1D1D1F; white-space: nowrap; }
        .gt tr:hover td { background: rgba(47,179,68,0.02); }
        .gt .actions { display: flex; gap: 4px; }
        .gt .actions button { background: none; border: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: #86868B; font-size: 16px; transition: all 0.2s; }
        .gt .actions button:hover { background: rgba(0,0,0,0.05); color: #1D1D1F; }
        .gt .actions button.del:hover { background: rgba(239,68,68,0.1); color: #DC2626; }

        .badge-st { display: inline-block; padding: 3px 12px; border-radius: 9999px; font-size: 11px; font-weight: 700; }
        .badge-st.ok { background: rgba(34,197,94,0.1); color: #16a34a; }
        .badge-st.warn { background: rgba(245,158,11,0.1); color: #d97706; }
        .badge-st.inactive { background: rgba(156,163,175,0.15); color: #6b7280; }

        .modal-content { border-radius: 22px; border: none; background: rgba(255,255,255,0.97); backdrop-filter: blur(20px); }
        .modal-header { border-bottom: 1px solid rgba(0,0,0,0.06); padding: 22px 26px; }
        .modal-title { font-weight: 800; font-size: 18px; }
        .modal-body { padding: 26px; max-height: 70vh; overflow-y: auto; }
        .modal-footer { border-top: 1px solid rgba(0,0,0,0.06); padding: 16px 26px; display: flex; gap: 8px; justify-content: flex-end; }
        .fld { margin-bottom: 16px; }
        .fld label { display: block; font-weight: 600; font-size: 12px; color: #1D1D1F; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
        .fld input, .fld select, .fld textarea { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); background: rgba(0,0,0,0.02); font-family: inherit; font-size: 14px; color: #1D1D1F; outline: none; transition: border 0.2s; box-sizing: border-box; }
        .fld input:focus, .fld select:focus, .fld textarea:focus { border-color: #2FB344; box-shadow: 0 0 0 3px rgba(47,179,68,0.08); }
        .fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        .empty-state { text-align: center; padding: 40px 20px; color: #AEAEB2; }
        .empty-state i { font-size: 40px; margin-bottom: 10px; opacity: 0.4; }
        .empty-state p { font-size: 14px; }

        @media (max-width: 768px) {
            .page-wrap { padding: 84px 16px 40px; }
            .stats-row { grid-template-columns: repeat(2,1fr); }
            .fld-row { grid-template-columns: 1fr; }
        }
        .readonly-mode .actions button:not(:first-child) { display: none !important; }
        .readonly-mode .btn-g.primary { display: none !important; }
    </style>
</head>
<body class="neomorphic-theme">
    <div id="left-sidebar"></div>
    <div id="topbar-container"></div>

    <div class="page-wrap">
        <div class="page-hdr">
            <h1><i class="ti ti-users"></i> Empleados</h1>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <a href="/templates/dashboard.html" class="btn-g"><i class="ti ti-arrow-left"></i> Dashboard</a>
                <button class="btn-g primary" onclick="abrirModal('employee')"><i class="ti ti-plus"></i> Nuevo Empleado</button>
            </div>
        </div>

        <div class="stats-row" id="statsRow">
            <div class="stat"><div class="s-icon s-blue"><i class="ti ti-users"></i></div><div class="s-label">Empleados</div><div class="s-val" id="stEmpleados">-</div></div>
            <div class="stat"><div class="s-icon s-purple"><i class="ti ti-building"></i></div><div class="s-label">Departamentos</div><div class="s-val" id="stDeptos">-</div></div>
            <div class="stat"><div class="s-icon s-cyan"><i class="ti ti-tag"></i></div><div class="s-label">Posiciones</div><div class="s-val" id="stPosiciones">-</div></div>
            <div class="stat"><div class="s-icon s-orange"><i class="ti ti-briefcase"></i></div><div class="s-label">Contratistas</div><div class="s-val" id="stContratistas">-</div></div>
            <div class="stat"><div class="s-icon s-green"><i class="ti ti-cash"></i></div><div class="s-label">Metodos Pago</div><div class="s-val" id="stPagos">-</div></div>
        </div>

        <div class="tabs" id="tabNav">
            <button class="tab active" data-tab="employees">Empleados</button>
            <button class="tab" data-tab="departments">Departamentos</button>
            <button class="tab" data-tab="positions">Posiciones</button>
            <button class="tab" data-tab="contractors">Contratistas</button>
            <button class="tab" data-tab="payments">Metodos de Pago</button>
        </div>

        <div class="panel" id="panelContent"></div>
    </div>

    <div class="modal fade" id="crudModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="crudModalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body" id="crudModalBody"></div>
                <div class="modal-footer"><button type="button" class="btn-g" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn-g primary" id="crudModalSave">Guardar</button></div>
            </div>
        </div>
    </div>

    <!-- Modal de detalle (solo lectura) -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="detailModalTitle">Detalle</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body" id="detailModalBody"></div>
                <div class="modal-footer"><button type="button" class="btn-g" data-bs-dismiss="modal">Cerrar</button></div>
            </div>
        </div>
    </div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script>
    var API = (window.AGROTECH_CONFIG && window.AGROTECH_CONFIG.API_BASE) || 'http://localhost:8000';
    var RRHH = API + '/api/RRHH/';
    var currentTab = 'employees';
    var editId = null; var editType = null;
    if (typeof isAdmin === 'function' && !isAdmin()) document.body.classList.add('readonly-mode');

    function token() { return localStorage.getItem('accessToken') || ''; }
    function hdrs() { return {'Authorization':'Bearer '+token(),'Content-Type':'application/json'}; }

    document.getElementById('tabNav').addEventListener('click', function(e) {
        if (e.target.classList.contains('tab')) {
            document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
            e.target.classList.add('active');
            currentTab = e.target.dataset.tab;
            renderTab();
        }
    });

    async function renderTab() {
        var p = document.getElementById('panelContent');
        switch (currentTab) {
            case 'employees': p.innerHTML = '<div class="panel-hdr"><div class="panel-title">Lista de Empleados</div><button class="btn-g primary sm" onclick="abrirModal(\'employee\')"><i class="ti ti-plus"></i> Nuevo</button></div><div class="gt-wrap"><table class="gt"><thead><tr><th>Nombre</th><th>ID</th><th>Email</th><th>Telefono</th><th>Departamento</th><th>Posicion</th><th>Salario</th><th>Contratacion</th><th></th></tr></thead><tbody id="dataBody"><tr><td colspan="8" style="text-align:center;padding:30px">Cargando...</td></tr></tbody></table></div>'; await loadEmployees(); break;
            case 'departments': p.innerHTML = '<div class="panel-hdr"><div class="panel-title">Departamentos</div><button class="btn-g primary sm" onclick="abrirModal(\'department\')"><i class="ti ti-plus"></i> Nuevo</button></div><div class="gt-wrap"><table class="gt"><thead><tr><th>Nombre</th><th>Descripcion</th><th></th></tr></thead><tbody id="dataBody"><tr><td colspan="3" style="text-align:center;padding:30px">Cargando...</td></tr></tbody></table></div>'; await loadList('departamentos'); break;
            case 'positions': p.innerHTML = '<div class="panel-hdr"><div class="panel-title">Posiciones</div><button class="btn-g primary sm" onclick="abrirModal(\'position\')"><i class="ti ti-plus"></i> Nueva</button></div><div class="gt-wrap"><table class="gt"><thead><tr><th>Nombre</th><th>Descripcion</th><th></th></tr></thead><tbody id="dataBody"><tr><td colspan="3" style="text-align:center;padding:30px">Cargando...</td></tr></tbody></table></div>'; await loadList('posiciones'); break;
            case 'contractors': p.innerHTML = '<div class="panel-hdr"><div class="panel-title">Contratistas</div><button class="btn-g primary sm" onclick="abrirModal(\'contractor\')"><i class="ti ti-plus"></i> Nuevo</button></div><div class="gt-wrap"><table class="gt"><thead><tr><th>Nombre</th><th>RUT</th><th>Descripcion</th><th></th></tr></thead><tbody id="dataBody"><tr><td colspan="4" style="text-align:center;padding:30px">Cargando...</td></tr></tbody></table></div>'; await loadContractors(); break;
            case 'payments': p.innerHTML = '<div class="panel-hdr"><div class="panel-title">Metodos de Pago</div><button class="btn-g primary sm" onclick="abrirModal(\'payment\')"><i class="ti ti-plus"></i> Nuevo</button></div><div class="gt-wrap"><table class="gt"><thead><tr><th>Nombre</th><th>Monto</th><th>Descripcion</th><th>Fecha</th><th></th></tr></thead><tbody id="dataBody"><tr><td colspan="5" style="text-align:center;padding:30px">Cargando...</td></tr></tbody></table></div>'; await loadPayments(); break;
        }
        loadStats();
    }

    async function loadStats() {
        var eps = [
            {url:'empleados/',el:'stEmpleados'},
            {url:'departamentos/',el:'stDeptos'},
            {url:'posiciones/',el:'stPosiciones'},
            {url:'contratistas-empleados/',el:'stContratistas'},
            {url:'metodos-pago/',el:'stPagos'}
        ];
        for (var i=0;i<eps.length;i++) {
            try {
                var r=await fetch(RRHH+eps[i].url,{headers:hdrs()});
                var d=await r.json();
                document.getElementById(eps[i].el).textContent = Array.isArray(d) ? d.length : (d.count||0);
            } catch(e) { document.getElementById(eps[i].el).textContent = '-'; }
        }
    }

    async function loadEmployees() {
        try {
            var r=await fetch(RRHH+'empleados/',{headers:hdrs()});
            var list=await r.json();
            var arr=Array.isArray(list)?list:(list.results||[]);
            var b=document.getElementById('dataBody');
             if (arr.length===0){b.innerHTML='<tr><td colspan="9"><div class="empty-state"><i class="ti ti-users"></i><p>No hay empleados registrados.</p></div></td></tr>';return;}
             b.innerHTML=arr.map(function(e){
                 var dept = e.department_name || (e.department&&e.department.name) || '-';
                 var pos = e.position_name || (e.position&&e.position.name) || '-';
                 var sal = e.salary_name || (e.salary && e.salary.name) || '-';
                 var hire = e.date_of_hire || '-';
                 return '<tr><td><strong>'+(e.first_name||'')+' '+(e.last_name||'')+'</strong></td><td>'+(e.identification_number||'-')+'</td><td>'+(e.email||'-')+'</td><td>'+(e.phone||'-')+'</td><td>'+dept+'</td><td>'+pos+'</td><td>'+sal+'</td><td>'+hire+'</td><td><div class="actions"><button onclick="verDetalle(\'employee\','+e.id+')"><i class="ti ti-eye"></i></button><button onclick="abrirModal(\'employee\','+e.id+')"><i class="ti ti-edit"></i></button><button class="del" onclick="eliminar(\'empleados\','+e.id+')"><i class="ti ti-trash"></i></button></div></td></tr>';
             }).join('');
         } catch(e) { document.getElementById('dataBody').innerHTML='<tr><td colspan="9" style="color:#DC2626;text-align:center">Error al cargar</td></tr>'; }
    }

    async function loadList(endpoint) {
        try {
            var r=await fetch(RRHH+endpoint+'/',{headers:hdrs()});
            var list=await r.json();
            var arr=Array.isArray(list)?list:(list.results||[]);
            var b=document.getElementById('dataBody');
            if (arr.length===0){b.innerHTML='<tr><td colspan="3"><div class="empty-state"><i class="ti ti-building"></i><p>No hay registros.</p></div></td></tr>';return;}
            b.innerHTML=arr.map(function(d){
                return '<tr><td><strong>'+(d.name||'-')+'</strong></td><td>'+(d.description||'-')+'</td><td><div class="actions"><button onclick="verDetalle(\''+(endpoint==='departamentos'?'department':'position')+'\','+d.id+')"><i class="ti ti-eye"></i></button><button onclick="abrirModal(\''+(endpoint==='departamentos'?'department':'position')+'\','+d.id+')"><i class="ti ti-edit"></i></button><button class="del" onclick="eliminar(\''+endpoint+'\','+d.id+')"><i class="ti ti-trash"></i></button></div></td></tr>';
            }).join('');
        } catch(e) { document.getElementById('dataBody').innerHTML='<tr><td colspan="3" style="color:#DC2626;text-align:center">Error</td></tr>'; }
    }

    async function loadContractors() {
        try {
            var r=await fetch(RRHH+'contratistas-empleados/',{headers:hdrs()});
            var list=await r.json();
            var arr=Array.isArray(list)?list:(list.results||[]);
            var b=document.getElementById('dataBody');
            if (arr.length===0){b.innerHTML='<tr><td colspan="4"><div class="empty-state"><i class="ti ti-briefcase"></i><p>No hay contratistas registrados.</p></div></td></tr>';return;}
            b.innerHTML=arr.map(function(c){
                return '<tr><td><strong>'+(c.first_name||'')+' '+(c.last_name||'')+'</strong></td><td>'+(c.rut||'-')+'</td><td>'+(c.description||'-')+'</td><td><div class="actions"><button onclick="verDetalle(\'contractor\','+c.id+')"><i class="ti ti-eye"></i></button><button onclick="abrirModal(\'contractor\','+c.id+')"><i class="ti ti-edit"></i></button><button class="del" onclick="eliminar(\'contratistas-empleados\','+c.id+')"><i class="ti ti-trash"></i></button></div></td></tr>';
            }).join('');
        } catch(e) { document.getElementById('dataBody').innerHTML='<tr><td colspan="4" style="color:#DC2626;text-align:center">Error</td></tr>'; }
    }

    async function loadPayments() {
        try {
            var r=await fetch(RRHH+'metodos-pago/',{headers:hdrs()});
            var list=await r.json();
            var arr=Array.isArray(list)?list:(list.results||[]);
            var b=document.getElementById('dataBody');
            if (arr.length===0){b.innerHTML='<tr><td colspan="5"><div class="empty-state"><i class="ti ti-cash"></i><p>No hay metodos de pago.</p></div></td></tr>';return;}
            b.innerHTML=arr.map(function(p){
                var amt = p.amount ? '$'+new Intl.NumberFormat('es-CO').format(p.amount) : '-';
                return '<tr><td><strong>'+(p.name||'-')+'</strong></td><td>'+amt+'</td><td>'+(p.description||'-')+'</td><td>'+(p.created_date||'-')+'</td><td><div class="actions"><button onclick="verDetalle(\'payment\','+p.id+')"><i class="ti ti-eye"></i></button><button onclick="abrirModal(\'payment\','+p.id+')"><i class="ti ti-edit"></i></button><button class="del" onclick="eliminar(\'metodos-pago\','+p.id+')"><i class="ti ti-trash"></i></button></div></td></tr>';
            }).join('');
        } catch(e) { document.getElementById('dataBody').innerHTML='<tr><td colspan="5" style="color:#DC2626;text-align:center">Error</td></tr>'; }
    }

    // ========== MODAL ==========
    function abrirModal(type, id) {
        editId = id || null; editType = type;
        var title='', body='';
        switch(type) {
            case 'employee':
                title = (id?'Editar':'Nuevo')+' Empleado';
                body = '<div class="fld-row"><div class="fld"><label>Nombre</label><input id="mf_first_name" placeholder="Juan"></div><div class="fld"><label>Apellido</label><input id="mf_last_name" placeholder="Perez"></div></div>'+
                    '<div class="fld-row"><div class="fld"><label>No. Identificacion</label><input id="mf_identification_number" type="number" placeholder="12345678"></div><div class="fld"><label>Email</label><input id="mf_email" type="email" placeholder="correo@ejemplo.com"></div></div>'+
                    '<div class="fld-row"><div class="fld"><label>Telefono</label><input id="mf_phone" type="number" placeholder="3001234567"></div><div class="fld"><label>Direccion</label><input id="mf_address" placeholder="Calle 123"></div></div>'+
                    '<div class="fld-row"><div class="fld"><label>Departamento</label><select id="mf_department"><option value="">Seleccionar...</option></select></div><div class="fld"><label>Posicion</label><select id="mf_position"><option value="">Seleccionar...</option></select></div></div>'+
                    '<div class="fld-row"><div class="fld"><label>Fecha Contratacion</label><input id="mf_date_of_hire" type="date"></div><div class="fld"><label>Salario (Metodo Pago)</label><select id="mf_salary"><option value="">Seleccionar...</option></select></div></div>';
                break;
            case 'department':
                title = (id?'Editar':'Nuevo')+' Departamento';
                body = '<div class="fld"><label>Nombre</label><input id="mf_name" placeholder="Ej: Produccion"></div><div class="fld"><label>Descripcion</label><textarea id="mf_description" rows="2" placeholder="Descripcion del departamento..."></textarea></div>';
                break;
            case 'position':
                title = (id?'Editar':'Nueva')+' Posicion';
                body = '<div class="fld"><label>Nombre</label><input id="mf_name" placeholder="Ej: Supervisor de Campo"></div><div class="fld"><label>Descripcion</label><textarea id="mf_description" rows="2" placeholder="Descripcion de la posicion..."></textarea></div>';
                break;
            case 'contractor':
                title = 'Nuevo Contratista';
                body = '<div class="fld-row"><div class="fld"><label>Nombre</label><input id="mf_first_name" placeholder="Nombre"></div><div class="fld"><label>Apellido</label><input id="mf_last_name" placeholder="Apellido"></div></div><div class="fld"><label>RUT</label><input id="mf_rut" placeholder="12345678-9"></div><div class="fld"><label>Descripcion</label><textarea id="mf_description" rows="2" placeholder="Servicios que presta..."></textarea></div>';
                break;
            case 'payment':
                title = (id?'Editar':'Nuevo')+' Metodo de Pago';
                body = '<div class="fld"><label>Nombre</label><input id="mf_name" placeholder="Ej: Salario Base"></div><div class="fld"><label>Monto</label><input id="mf_amount" type="number" step="0.01" placeholder="0.00"></div><div class="fld"><label>Descripcion</label><textarea id="mf_description" rows="2" placeholder="Detalle del metodo de pago..."></textarea></div>';
                break;
        }
        document.getElementById('crudModalTitle').textContent=title;
        document.getElementById('crudModalBody').innerHTML=body;
        new bootstrap.Modal(document.getElementById('crudModal')).show();

        if (type==='employee') cargarSelectsEmpleado();
        if (id) cargarEdicion(type,id);
    }

    async function cargarSelectsEmpleado() {
        try {
            var dr=await fetch(RRHH+'departamentos/',{headers:hdrs()});
            var deptos=await dr.json(); var dl=Array.isArray(deptos)?deptos:(deptos.results||[]);
            var ds=document.getElementById('mf_department');
            if(ds)ds.innerHTML='<option value="">Seleccionar...</option>'+dl.map(function(d){return '<option value="'+d.id+'">'+d.name+'</option>';}).join('');

            var pr=await fetch(RRHH+'posiciones/',{headers:hdrs()});
            var pos=await pr.json(); var pl=Array.isArray(pos)?pos:(pos.results||[]);
            var ps=document.getElementById('mf_position');
            if(ps)ps.innerHTML='<option value="">Seleccionar...</option>'+pl.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>';}).join('');

            var mr=await fetch(RRHH+'metodos-pago/',{headers:hdrs()});
            var met=await mr.json(); var ml=Array.isArray(met)?met:(met.results||[]);
            var ms=document.getElementById('mf_salary');
            if(ms)ms.innerHTML='<option value="">Seleccionar...</option>'+ml.map(function(m){return '<option value="'+m.id+'">'+m.name+' ($'+m.amount+')</option>';}).join('');
        } catch(e) {}
    }

    async function cargarEdicion(type,id) {
        var epMap={'employee':'empleados','department':'departamentos','position':'posiciones','payment':'metodos-pago'};
        try {
            var r=await fetch(RRHH+(epMap[type]||'empleados')+'/'+id+'/',{headers:hdrs()});
            var d=await r.json();
            setV('mf_first_name',d.first_name);
            setV('mf_last_name',d.last_name);
            setV('mf_identification_number',d.identification_number);
            setV('mf_email',d.email);
            setV('mf_phone',d.phone);
            setV('mf_address',d.address);
            setV('mf_date_of_hire',d.date_of_hire);
            setV('mf_name',d.name);
            setV('mf_description',d.description);
            setV('mf_amount',d.amount);
            setV('mf_rut',d.rut);
            if(d.department)setV('mf_department',d.department.id||d.department);
            if(d.position)setV('mf_position',d.position.id||d.position);
            if(d.salary)setV('mf_salary',d.salary.id||d.salary);
        } catch(e) {}
    }

    function setV(id,val){var el=document.getElementById(id);if(el&&val!==undefined&&val!==null)el.value=val;}
    function getV(id){var el=document.getElementById(id);return el?el.value:'';}

    document.getElementById('crudModalSave').addEventListener('click', async function() {
        var epMap={'employee':'empleados','department':'departamentos','position':'posiciones','contractor':'contratistas-empleados','payment':'metodos-pago'};
        var payload={};
        switch(editType) {
            case 'employee': payload={first_name:getV('mf_first_name'),last_name:getV('mf_last_name'),identification_number:parseInt(getV('mf_identification_number'))||0,email:getV('mf_email'),phone:parseInt(getV('mf_phone'))||0,address:getV('mf_address'),date_of_hire:getV('mf_date_of_hire'),department:getV('mf_department')||null,position:getV('mf_position')||null,salary:getV('mf_salary')||null}; break;
            case 'department': payload={name:getV('mf_name'),description:getV('mf_description')}; break;
            case 'position': payload={name:getV('mf_name'),description:getV('mf_description')}; break;
            case 'contractor': payload={first_name:getV('mf_first_name'),last_name:getV('mf_last_name'),rut:getV('mf_rut'),description:getV('mf_description')}; break;
            case 'payment': payload={name:getV('mf_name'),amount:parseFloat(getV('mf_amount'))||0,description:getV('mf_description')}; break;
        }

        var url=RRHH+epMap[editType]+'/';
        var method='POST';
        if(editId){url+=editId+'/';method='PATCH';}

        try {
            var r=await fetch(url,{method:method,headers:hdrs(),body:JSON.stringify(payload)});
            if(r.ok){bootstrap.Modal.getInstance(document.getElementById('crudModal')).hide();renderTab();loadStats();}
            else{var err=await r.json();alert('Error: '+JSON.stringify(err));}
        } catch(e) { alert('Error de conexion'); }
    });

    async function eliminar(endpoint, id) {
        if(!confirm('Eliminar este registro?'))return;
        try {
            var r=await fetch(RRHH+endpoint+'/'+id+'/',{method:'DELETE',headers:hdrs()});
            if(r.ok){renderTab();loadStats();}
            else alert('Error al eliminar');
        } catch(e) { alert('Error de conexion'); }
    }

    async function verDetalle(type, id) {
        var epMap = {'employee':'empleados','department':'departamentos','position':'posiciones','contractor':'contratistas-empleados','payment':'metodos-pago'};
        try {
            var r = await fetch(RRHH + epMap[type] + '/' + id + '/', {headers:hdrs()});
            var d = await r.json();
            var rows = [];
            function addRow(label, val) {
                if (val !== undefined && val !== null && val !== '') rows.push('<div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,0.06)"><span style="color:#6b7280;font-size:13px">'+label+'</span><span style="font-weight:600;font-size:14px;text-align:right">'+val+'</span></div>');
            }
            function peso(v){return (v!=null&&v!=='')?'$'+Number(v).toLocaleString('es-CO'):null;}
            if (type === 'employee') {
                document.getElementById('detailModalTitle').textContent = 'Empleado: ' + ((d.first_name||'')+' '+(d.last_name||'')).trim();
                addRow('Nombre', (d.first_name||'')+' '+(d.last_name||''));
                addRow('Identificación', d.identification_number);
                addRow('Email', d.email);
                addRow('Teléfono', d.phone);
                addRow('Dirección', d.address);
                addRow('Departamento', d.department_name || (d.department&&d.department.name));
                addRow('Cargo', d.position_name || (d.position&&d.position.name));
                addRow('Método de pago', d.salary_name || (d.salary&&d.salary.name));
                addRow('Fecha contratación', d.date_of_hire);
            } else if (type === 'contractor') {
                document.getElementById('detailModalTitle').textContent = 'Contratista: ' + ((d.first_name||'')+' '+(d.last_name||'')).trim();
                addRow('Nombre', (d.first_name||'')+' '+(d.last_name||''));
                addRow('RUT', d.rut);
                addRow('Identificación', d.identification_number);
                addRow('Teléfono', d.phone);
                addRow('Descripción', d.description);
            } else if (type === 'payment') {
                document.getElementById('detailModalTitle').textContent = 'Método de pago';
                addRow('Nombre', d.name);
                addRow('Monto', peso(d.amount));
                addRow('Descripción', d.description);
                addRow('Fecha', d.created_date);
            } else {
                document.getElementById('detailModalTitle').textContent = (type==='department'?'Departamento':'Cargo');
                addRow('Nombre', d.name);
                addRow('Descripción', d.description);
            }
            document.getElementById('detailModalBody').innerHTML = rows.length ? rows.join('') : '<p style="color:#6b7280">Sin información.</p>';
            new bootstrap.Modal(document.getElementById('detailModal')).show();
        } catch(e) { alert('Error al cargar detalle'); }
    }

    document.addEventListener('DOMContentLoaded', function() { renderTab(); });

    function handleResponsiveNav() {
        var tb=document.getElementById('topbar-container');
        if(tb)tb.style.display=window.innerWidth<=991?'none':'block';
    }
    window.addEventListener('resize',handleResponsiveNav);
    window.addEventListener('DOMContentLoaded',handleResponsiveNav);
    </script>

        import { loadLayoutComponents } from '/static/js/load_components.js';
        loadLayoutComponents({});
