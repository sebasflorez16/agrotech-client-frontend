<!-- Topbar único - AgroTech Digital (hamburguesa abre el sidebar lateral) -->
<link href="https://unpkg.com/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

<div class="topbar-custom">
    <button class="menu-toggle" aria-label="Abrir menú" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>
    <div class="topbar-title">Agrotech Digital</div>
    <div class="topbar-actions">
        <button class="topbar-icon" aria-label="Notificaciones" disabled>
            <i class="fas fa-bell"></i>
        </button>
        <button class="topbar-icon" aria-label="Perfil" disabled>
            <i class="fas fa-user-circle"></i>
        </button>
    </div>
</div>

<style>
.topbar-custom {
    width: 100%;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 2500;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 2px 8px rgba(44,62,80,0.07);
    border-bottom: 1px solid rgba(255, 255, 255, 0.6);
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
}
.menu-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    font-size: 22px;
    color: #2C3E50;
    margin-right: 8px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 10px;
}
.topbar-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: #2C3E50;
    letter-spacing: 0.5px;
}
.topbar-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}
.topbar-icon {
    font-size: 22px;
    color: #2C3E50;
    background: none;
    border: none;
    cursor: not-allowed;
    opacity: 0.6;
}
@media (min-width: 992px) {
    .topbar-custom {
        height: 64px;
        padding: 0 24px 0 262px; /* deja espacio para el sidebar fijo */
    }
    .menu-toggle {
        display: none !important;
    }
    .topbar-title {
        font-size: 1.2rem;
    }
}
</style>
